{% extends 'base.html' %}

{% block title %} Checkout {% endblock title %}

{% block body %}

<div class="container py-5">

    <div class="text-center mb-5">
        <h2>Checkout</h2>
        <p class="lead">Complete your billing information and place your order.</p>
    </div>

    <div class="row g-5">

        <!-- Cart Summary -->
        <div class="col-md-5 col-lg-4 order-md-last">

            <h4 class="d-flex justify-content-between align-items-center mb-3">
                <span class="text-primary">Your Cart</span>
                <span class="badge bg-primary rounded-pill" id="cart-count"></span>
            </h4>

            <ul class="list-group mb-3" id="checkout-items">
            </ul>

        </div>

        <!-- Billing Form -->
        <div class="col-md-7 col-lg-8">

            <form id="checkout-form">

                <h4 class="mb-3">Billing Address</h4>

                <div class="row g-3">

                    <div class="col-sm-6">
                        <label class="form-label">First Name</label>
                        <input type="text" class="form-control" required>
                    </div>

                    <div class="col-sm-6">
                        <label class="form-label">Last Name</label>
                        <input type="text" class="form-control" required>
                    </div>

                    <div class="col-12">
                        <label class="form-label">Username</label>
                        <div class="input-group">
                            <span class="input-group-text">@</span>
                            <input type="text" class="form-control" required>
                        </div>
                    </div>

                    <div class="col-12">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" placeholder="you@example.com" required>
                    </div>

                    <div class="col-12">
                        <label class="form-label">Address</label>
                        <input type="text" class="form-control" required>
                    </div>

                    <div class="col-md-5">
                        <label class="form-label">Country</label>
                        <select class="form-select" required>
                            <option value="">Choose...</option>
                            <option>India</option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">State</label>
                        <select class="form-select" required>
                            <option value="">Choose...</option>
                            <option>Gujarat</option>
                            <option>Goa</option>
                        </select>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">PIN Code</label>
                        <input type="number" class="form-control" required>
                    </div>

                </div>

                <hr class="my-4">

                <h4 class="mb-3">Payment Method</h4>

                <div class="form-check">
                    <input class="form-check-input" type="radio" name="payment" checked>
                    <label class="form-check-label">Credit Card</label>
                </div>

                <div class="form-check">
                    <input class="form-check-input" type="radio" name="payment">
                    <label class="form-check-label">Debit Card</label>
                </div>

                <div class="form-check mb-3">
                    <input class="form-check-input" type="radio" name="payment">
                    <label class="form-check-label">UPI</label>
                </div>

                <div class="row gy-3">

                    <div class="col-md-6">
                        <label class="form-label">Name on Card</label>
                        <input type="text" class="form-control" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Card Number</label>
                        <input type="number" class="form-control" required>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">Expiry</label>
                        <input type="month" class="form-control" placeholder="MM/YY" required>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">CVV</label>
                        <input type="password" class="form-control" required>
                    </div>

                </div>

                <hr class="my-4">

                <button class="w-100 btn btn-success btn-lg" type="submit">
                    Place Order
                </button>

            </form>

        </div>

    </div>

</div>

<script>
let cart = JSON.parse(localStorage.getItem('cart')) || [];

let total = 0;
let html = '';

cart.forEach(item => {

    total += Number(item.price);

    html += `
    <li class="list-group-item d-flex justify-content-between">
        <span>${item.name}</span>
        <strong>₹${item.price}</strong>
    </li>`;
});

html += `
<li class="list-group-item d-flex justify-content-between">
    <span>Total</span>
    <strong>₹${total}</strong>
</li>`;

document.getElementById('checkout-items').innerHTML = html;
document.getElementById('cart-count').innerText = cart.length;

document.getElementById('checkout-form').addEventListener('submit', function(e){

    e.preventDefault();

    localStorage.removeItem('cart');

    document.body.innerHTML = `
    <div class="container text-center py-5">
        <div class="card shadow p-5">
            <h1 class="display-1 text-success">✓</h1>
            <h2>Order Placed Successfully!</h2>
            <p>Thank you for shopping with MJ Fashion.</p>
            <a href="/" class="btn btn-primary mt-3">
                Continue Shopping
            </a>
        </div>
    </div>`;
});
</script>
{%endblock body%}

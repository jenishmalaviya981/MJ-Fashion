{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | MJ Fashion</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding-right: 120px;
            background: url("https://images.unsplash.com/photo-1441984904996-e0b6ba687e04?w=1920&q=80") no-repeat center center;
            background-size: cover;
            position: relative;
        }

        /* Premium overlay with gradient */
        body::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, 
                rgba(0,0,0,0.7) 0%, 
                rgba(0,0,0,0.4) 40%,
                rgba(79, 70, 229, 0.15) 70%,
                rgba(124, 58, 237, 0.2) 100%);
            z-index: 0;
        }

        /* Decorative floating elements */
        .floating-elements {
            position: absolute;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .floating-elements .circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(167, 139, 250, 0.08);
            animation: float 20s infinite ease-in-out;
        }

        .floating-elements .circle:nth-child(1) {
            width: 300px;
            height: 300px;
            top: -50px;
            right: -50px;
            animation-delay: 0s;
        }

        .floating-elements .circle:nth-child(2) {
            width: 200px;
            height: 200px;
            bottom: 100px;
            left: -80px;
            animation-delay: -7s;
            background: rgba(124, 58, 237, 0.06);
        }

        .floating-elements .circle:nth-child(3) {
            width: 150px;
            height: 150px;
            top: 40%;
            right: 30%;
            animation-delay: -14s;
            background: rgba(167, 139, 250, 0.05);
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(-30px, 20px) scale(1.05); }
            50% { transform: translate(20px, -30px) scale(0.95); }
            75% { transform: translate(-20px, -10px) scale(1.02); }
        }

        /* ====== LOGIN CARD ====== */
        .login-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            box-shadow: 
                0 25px 60px rgba(0,0,0,0.5),
                inset 0 1px 0 rgba(255,255,255,0.05);
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .card-body {
            padding: 45px 40px 40px;
        }

        /* ====== LOGO ====== */
        .logo-wrapper {
            text-align: center;
            margin-bottom: 8px;
        }

        .logo-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, rgba(167, 139, 250, 0.2), rgba(124, 58, 237, 0.1));
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            border: 1px solid rgba(167, 139, 250, 0.2);
            margin-bottom: 12px;
            box-shadow: 0 8px 32px rgba(79, 70, 229, 0.15);
            animation: pulse 3s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 8px 32px rgba(79, 70, 229, 0.15); }
            50% { box-shadow: 0 8px 48px rgba(79, 70, 229, 0.25); }
        }

        .brand-name {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 0%, #c4b5fd 60%, #a78bfa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .brand-sub {
            font-size: 12px;
            color: rgba(255,255,255,0.35);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-top: 2px;
            font-weight: 300;
        }

        h2 {
            text-align: center;
            color: white;
            font-weight: 700;
            font-size: 24px;
            margin-bottom: 28px;
            letter-spacing: -0.3px;
        }

        /* ====== FORM FIELDS ====== */
        .form-label {
            color: rgba(255,255,255,0.7);
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 6px;
        }

        .form-label i {
            margin-right: 6px;
            font-size: 14px;
        }

        .form-control {
            background: rgba(255,255,255,0.06);
            border: 1.5px solid rgba(255,255,255,0.08);
            color: white;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .form-control::placeholder {
            color: rgba(255,255,255,0.3);
            font-weight: 300;
            font-size: 14px;
        }

        .form-control:focus {
            background: rgba(255,255,255,0.1);
            color: white;
            border-color: #a78bfa;
            box-shadow: 0 0 0 4px rgba(167, 139, 250, 0.1);
        }

        .input-group {
            position: relative;
        }

        .input-group .btn {
            border: 1.5px solid rgba(255,255,255,0.08);
            border-left: none;
            color: rgba(255,255,255,0.5);
            background: rgba(255,255,255,0.04);
            border-radius: 0 12px 12px 0;
            padding: 0 16px;
            transition: all 0.3s ease;
        }

        .input-group .btn:hover {
            background: rgba(255,255,255,0.08);
            color: rgba(255,255,255,0.8);
        }

        .input-group .btn i {
            font-size: 18px;
        }

        .input-group .form-control {
            border-radius: 12px 0 0 12px;
            border-right: none;
        }

        .input-group .form-control:focus {
            border-right: none;
        }

        .input-group .form-control:focus + .btn {
            border-color: #a78bfa;
        }

        /* ====== CHECKBOX & FORGOT ====== */
        .form-check-label {
            color: rgba(255,255,255,0.6);
            font-size: 14px;
            font-weight: 400;
        }

        .form-check-input {
            background: rgba(255,255,255,0.06);
            border: 1.5px solid rgba(255,255,255,0.15);
            border-radius: 4px;
            width: 18px;
            height: 18px;
            margin-top: 2px;
            transition: all 0.3s ease;
        }

        .form-check-input:checked {
            background: linear-gradient(135deg, #818cf8, #a78bfa);
            border-color: #a78bfa;
        }

        .form-check-input:focus {
            box-shadow: 0 0 0 3px rgba(167, 139, 250, 0.15);
        }

        .forgot-link {
            color: rgba(255,255,255,0.5);
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .forgot-link:hover {
            color: #a78bfa;
            text-decoration: none;
        }

        /* ====== LOGIN BUTTON ====== */
        .btn-login {
            width: 100%;
            border-radius: 12px;
            padding: 14px;
            font-weight: 700;
            font-size: 16px;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            border: none;
            color: white;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-login::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: all 0.6s ease;
        }

        .btn-login:hover::before {
            left: 100%;
        }

        .btn-login:hover {
            background: linear-gradient(135deg, #4338ca, #6d28d9);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(79, 70, 229, 0.35);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        /* ====== FOOTER ====== */
        .footer-text {
            text-align: center;
            margin-top: 24px;
            color: rgba(255,255,255,0.4);
            font-size: 14px;
        }

        .footer-text a {
            color: #a78bfa;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .footer-text a:hover {
            color: #c4b5fd;
            text-decoration: underline;
        }

        /* ====== DIVIDER ====== */
        .divider {
            display: flex;
            align-items: center;
            margin: 24px 0;
            color: rgba(255,255,255,0.15);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
        }

        .divider::before {
            margin-right: 16px;
        }

        .divider::after {
            margin-left: 16px;
        }

        /* ====== SOCIAL BUTTONS ====== */
        .social-buttons {
            display: flex;
            gap: 12px;
        }

        .social-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px;
            border-radius: 12px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            color: rgba(255,255,255,0.6);
            font-weight: 500;
            font-size: 13px;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .social-btn:hover {
            background: rgba(255,255,255,0.08);
            color: white;
            transform: translateY(-2px);
            border-color: rgba(255,255,255,0.1);
        }

        .social-btn i {
            font-size: 18px;
        }

        .social-btn.google:hover {
            border-color: rgba(234, 67, 53, 0.3);
            box-shadow: 0 4px 20px rgba(234, 67, 53, 0.1);
        }

        .social-btn.facebook:hover {
            border-color: rgba(24, 119, 242, 0.3);
            box-shadow: 0 4px 20px rgba(24, 119, 242, 0.1);
        }

        /* ====== RESPONSIVE ====== */
        @media (max-width: 992px) {
            body {
                padding-right: 60px;
            }
        }

        @media (max-width: 768px) {
            body {
                justify-content: center;
                padding-right: 0;
                padding: 20px;
            }

            .login-card {
                width: 100%;
                max-width: 400px;
            }

            .card-body {
                padding: 32px 24px 28px;
            }

            .brand-name {
                font-size: 24px;
            }

            .logo-icon {
                width: 65px;
                height: 65px;
                font-size: 30px;
            }

            h2 {
                font-size: 20px;
                margin-bottom: 20px;
            }

            .social-btn {
                font-size: 12px;
                padding: 8px;
            }

            .social-btn i {
                font-size: 16px;
            }

            .floating-elements .circle {
                display: none;
            }
        }

        @media (max-width: 480px) {
            .card-body {
                padding: 24px 16px 20px;
            }

            .form-control {
                font-size: 14px;
                padding: 10px 14px;
            }

            .btn-login {
                padding: 12px;
                font-size: 15px;
            }

            .social-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

<!-- ====== DECORATIVE FLOATING ELEMENTS ====== -->
<div class="floating-elements">
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>
</div>

<!-- ====== LOGIN CARD ====== -->
<div class="card login-card">
    <div class="card-body">

        <!-- ====== LOGO ====== -->
        <div class="logo-wrapper">
            <div class="logo-icon">👔</div>
            <div class="brand-name">MJ Fashion</div>
            <div class="brand-sub">Premium Style</div>
        </div>

        <h2>Welcome Back</h2>

        <!-- ====== LOGIN FORM ====== -->
        <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label"><i class="bi bi-person"></i>Username</label>
                <input type="text"
                       class="form-control"
                       name="username"
                       placeholder="Enter your username"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label"><i class="bi bi-lock"></i>Password</label>
                <div class="input-group">
                    <input type="password"
                           class="form-control"
                           id="password"
                           name="password"
                           placeholder="Enter your password"
                           required>
                    <button class="btn"
                            type="button"
                            id="toggleBtn"
                            onclick="togglePassword()">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="rememberMe">
                    <label class="form-check-label" for="rememberMe">
                        Remember Me
                    </label>
                </div>
                <a href="#" class="forgot-link">Forgot Password?</a>
            </div>

            <button type="submit" class="btn btn-login">
                <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
            </button>
        </form>

        <!-- ====== DIVIDER ====== -->
        <div class="divider">or continue with</div>

        <!-- ====== SOCIAL LOGIN ====== -->
        <div class="social-buttons">
            <a href="#" class="social-btn google">
                <i class="bi bi-google"></i> Google
            </a>
            <a href="#" class="social-btn facebook">
                <i class="bi bi-facebook"></i> Facebook
            </a>
        </div>

        <!-- ====== FOOTER ====== -->
        <div class="footer-text">
            <p class="mb-0">
                Don't have an account?
                <a href="/register">Create Account</a>
            </p>
        </div>

    </div>
</div>

<!-- ====== TOGGLE PASSWORD SCRIPT ====== -->
<script>
function togglePassword() {
    const password = document.getElementById("password");
    const btn = document.getElementById("toggleBtn");
    const icon = btn.querySelector("i");

    if (password.type === "password") {
        password.type = "text";
        icon.className = "bi bi-eye-slash";
    } else {
        password.type = "password";
        icon.className = "bi bi-eye";
    }
}
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>

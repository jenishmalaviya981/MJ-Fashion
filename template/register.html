{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | MJ Fashion</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding-right: 120px;
            background: url("https://images.unsplash.com/photo-1441984904996-e0b6ba687e04?w=1920&q=80") no-repeat center center;
            background-size: cover;
            position: relative;
        }

        /* Premium overlay with gradient */
        body::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, 
                rgba(0,0,0,0.7) 0%, 
                rgba(0,0,0,0.4) 40%,
                rgba(79, 70, 229, 0.15) 70%,
                rgba(124, 58, 237, 0.2) 100%);
            z-index: 0;
        }

        /* Decorative floating elements */
        .floating-elements {
            position: absolute;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .floating-elements .circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(167, 139, 250, 0.08);
            animation: float 20s infinite ease-in-out;
        }

        .floating-elements .circle:nth-child(1) {
            width: 300px;
            height: 300px;
            top: -50px;
            right: -50px;
            animation-delay: 0s;
        }

        .floating-elements .circle:nth-child(2) {
            width: 200px;
            height: 200px;
            bottom: 100px;
            left: -80px;
            animation-delay: -7s;
            background: rgba(124, 58, 237, 0.06);
        }

        .floating-elements .circle:nth-child(3) {
            width: 150px;
            height: 150px;
            top: 40%;
            right: 30%;
            animation-delay: -14s;
            background: rgba(167, 139, 250, 0.05);
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(-30px, 20px) scale(1.05); }
            50% { transform: translate(20px, -30px) scale(0.95); }
            75% { transform: translate(-20px, -10px) scale(1.02); }
        }

        /* ====== REGISTER CARD ====== */
        .register-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            box-shadow: 
                0 25px 60px rgba(0,0,0,0.5),
                inset 0 1px 0 rgba(255,255,255,0.05);
            animation: slideUp 0.6s ease-out;
            padding: 0;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .card-body {
            padding: 45px 40px 40px;
        }

        /* ====== LOGO ====== */
        .logo-wrapper {
            text-align: center;
            margin-bottom: 8px;
        }

        .logo-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, rgba(167, 139, 250, 0.2), rgba(124, 58, 237, 0.1));
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            border: 1px solid rgba(167, 139, 250, 0.2);
            margin-bottom: 12px;
            box-shadow: 0 8px 32px rgba(79, 70, 229, 0.15);
            animation: pulse 3s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 8px 32px rgba(79, 70, 229, 0.15); }
            50% { box-shadow: 0 8px 48px rgba(79, 70, 229, 0.25); }
        }

        .brand-name {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 0%, #c4b5fd 60%, #a78bfa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .brand-sub {
            font-size: 12px;
            color: rgba(255,255,255,0.35);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-top: 2px;
            font-weight: 300;
        }

        h2 {
            text-align: center;
            color: white;
            font-weight: 700;
            font-size: 24px;
            margin-bottom: 28px;
            letter-spacing: -0.3px;
        }

        /* ====== FORM FIELDS ====== */
        .form-label {
            color: rgba(255,255,255,0.7);
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 6px;
        }

        .form-label i {
            margin-right: 6px;
            font-size: 14px;
        }

        .form-control {
            background: rgba(255,255,255,0.06);
            border: 1.5px solid rgba(255,255,255,0.08);
            color: white;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .form-control::placeholder {
            color: rgba(255,255,255,0.3);
            font-weight: 300;
            font-size: 14px;
        }

        .form-control:focus {
            background: rgba(255,255,255,0.1);
            color: white;
            border-color: #a78bfa;
            box-shadow: 0 0 0 4px rgba(167, 139, 250, 0.1);
        }

        .form-control.is-invalid {
            border-color: #ef4444;
            box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.1);
        }

        .form-control.is-valid {
            border-color: #22c55e;
            box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.1);
        }

        /* ====== PASSWORD TOGGLE ====== */
        .input-group {
            position: relative;
        }

        .input-group .btn {
            border: 1.5px solid rgba(255,255,255,0.08);
            border-left: none;
            color: rgba(255,255,255,0.5);
            background: rgba(255,255,255,0.04);
            border-radius: 0 12px 12px 0;
            padding: 0 16px;
            transition: all 0.3s ease;
        }

        .input-group .btn:hover {
            background: rgba(255,255,255,0.08);
            color: rgba(255,255,255,0.8);
        }

        .input-group .btn i {
            font-size: 18px;
        }

        .input-group .form-control {
            border-radius: 12px 0 0 12px;
            border-right: none;
        }

        .input-group .form-control:focus {
            border-right: none;
        }

        .input-group .form-control:focus + .btn {
            border-color: #a78bfa;
        }

        /* ====== PASSWORD STRENGTH ====== */
        .password-strength {
            margin-top: 8px;
            height: 4px;
            border-radius: 2px;
            background: rgba(255,255,255,0.06);
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .password-strength .bar {
            height: 100%;
            width: 0%;
            border-radius: 2px;
            transition: all 0.4s ease;
        }

        .password-strength .bar.weak {
            width: 25%;
            background: #ef4444;
        }

        .password-strength .bar.medium {
            width: 50%;
            background: #f59e0b;
        }

        .password-strength .bar.strong {
            width: 75%;
            background: #22c55e;
        }

        .password-strength .bar.very-strong {
            width: 100%;
            background: #10b981;
        }

        .password-hint {
            color: rgba(255,255,255,0.3);
            font-size: 11px;
            margin-top: 4px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .password-hint .hint-item {
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.3s ease;
        }

        .password-hint .hint-item.valid {
            color: #22c55e;
        }

        .password-hint .hint-item i {
            font-size: 12px;
        }

        /* ====== REGISTER BUTTON ====== */
        .btn-register {
            width: 100%;
            border-radius: 12px;
            padding: 14px;
            font-weight: 700;
            font-size: 16px;
            background: linear-gradient(135deg, #059669, #10b981);
            border: none;
            color: white;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-register::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: all 0.6s ease;
        }

        .btn-register:hover::before {
            left: 100%;
        }

        .btn-register:hover {
            background: linear-gradient(135deg, #047857, #059669);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(5, 150, 105, 0.35);
        }

        .btn-register:active {
            transform: translateY(0);
        }

        .btn-register:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        /* ====== TERMS ====== */
        .terms-check {
            margin: 16px 0 20px;
        }

        .terms-check .form-check-label {
            color: rgba(255,255,255,0.5);
            font-size: 13px;
        }

        .terms-check .form-check-label a {
            color: #a78bfa;
            text-decoration: none;
        }

        .terms-check .form-check-label a:hover {
            color: #c4b5fd;
            text-decoration: underline;
        }

        .form-check-input {
            background: rgba(255,255,255,0.06);
            border: 1.5px solid rgba(255,255,255,0.15);
            border-radius: 4px;
            width: 18px;
            height: 18px;
            margin-top: 2px;
            transition: all 0.3s ease;
        }

        .form-check-input:checked {
            background: linear-gradient(135deg, #818cf8, #a78bfa);
            border-color: #a78bfa;
        }

        .form-check-input:focus {
            box-shadow: 0 0 0 3px rgba(167, 139, 250, 0.15);
        }

        /* ====== FOOTER ====== */
        .footer-text {
            text-align: center;
            margin-top: 24px;
            color: rgba(255,255,255,0.4);
            font-size: 14px;
        }

        .footer-text a {
            color: #a78bfa;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .footer-text a:hover {
            color: #c4b5fd;
            text-decoration: underline;
        }

        /* ====== DIVIDER ====== */
        .divider {
            display: flex;
            align-items: center;
            margin: 22px 0;
            color: rgba(255,255,255,0.15);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
        }

        .divider::before {
            margin-right: 16px;
        }

        .divider::after {
            margin-left: 16px;
        }

        /* ====== RESPONSIVE ====== */
        @media (max-width: 992px) {
            body {
                padding-right: 60px;
            }
        }

        @media (max-width: 768px) {
            body {
                justify-content: center;
                padding-right: 0;
                padding: 20px;
            }

            .register-card {
                width: 100%;
                max-width: 400px;
            }

            .card-body {
                padding: 32px 24px 28px;
            }

            .brand-name {
                font-size: 24px;
            }

            .logo-icon {
                width: 65px;
                height: 65px;
                font-size: 30px;
            }

            h2 {
                font-size: 20px;
                margin-bottom: 20px;
            }

            .floating-elements .circle {
                display: none;
            }
        }

        @media (max-width: 480px) {
            .card-body {
                padding: 24px 16px 20px;
            }

            .form-control {
                font-size: 14px;
                padding: 10px 14px;
            }

            .btn-register {
                padding: 12px;
                font-size: 15px;
            }

            .password-hint {
                font-size: 10px;
                gap: 8px;
            }
        }
    </style>
</head>
<body>

<!-- ====== DECORATIVE FLOATING ELEMENTS ====== -->
<div class="floating-elements">
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>
</div>

<!-- ====== REGISTER CARD ====== -->
<div class="register-card">
    <div class="card-body">

        <!-- ====== LOGO ====== -->
        <div class="logo-wrapper">
            <div class="logo-icon">👔</div>
            <div class="brand-name">MJ Fashion</div>
            <div class="brand-sub">Create Account</div>
        </div>

        <h2>Get Started</h2>

        <!-- ====== REGISTER FORM ====== -->
        <form method="POST" id="registerForm">
            {% csrf_token %}

            <!-- Username -->
            <div class="mb-3">
                <label class="form-label"><i class="bi bi-person"></i>Username</label>
                <input type="text"
                       class="form-control"
                       id="username"
                       name="username"
                       placeholder="Choose a username"
                       minlength="3"
                       maxlength="20"
                       required>
                <div class="invalid-feedback" style="display:none; color: #ef4444; font-size: 12px; margin-top: 4px;">
                    Username must be at least 3 characters
                </div>
            </div>

            <!-- Email -->
            <div class="mb-3">
                <label class="form-label"><i class="bi bi-envelope"></i>Email Address</label>
                <input type="email"
                       class="form-control"
                       id="email"
                       name="email"
                       placeholder="Enter your email"
                       required>
                <div class="invalid-feedback" style="display:none; color: #ef4444; font-size: 12px; margin-top: 4px;">
                    Please enter a valid email address
                </div>
            </div>

            <!-- Password -->
            <div class="mb-3">
                <label class="form-label"><i class="bi bi-lock"></i>Password</label>
                <div class="input-group">
                    <input type="password"
                           class="form-control"
                           id="password"
                           name="password"
                           placeholder="Create a strong password"
                           minlength="8"
                           required>
                    <button class="btn"
                            type="button"
                            id="toggleBtn"
                            onclick="togglePassword()">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
                
                <!-- Password Strength -->
                <div class="password-strength" id="passwordStrength">
                    <div class="bar" id="strengthBar"></div>
                </div>
                
                <!-- Password Hints -->
                <div class="password-hint" id="passwordHints">
                    <span class="hint-item" id="hintLength">
                        <i class="bi bi-circle"></i> 8+ characters
                    </span>
                    <span class="hint-item" id="hintUpper">
                        <i class="bi bi-circle"></i> Uppercase
                    </span>
                    <span class="hint-item" id="hintLower">
                        <i class="bi bi-circle"></i> Lowercase
                    </span>
                    <span class="hint-item" id="hintNumber">
                        <i class="bi bi-circle"></i> Number
                    </span>
                </div>
            </div>

            <!-- Confirm Password -->
            <div class="mb-3">
                <label class="form-label"><i class="bi bi-check-circle"></i>Confirm Password</label>
                <div class="input-group">
                    <input type="password"
                           class="form-control"
                           id="confirmPassword"
                           name="confirm_password"
                           placeholder="Confirm your password"
                           required>
                    <button class="btn"
                            type="button"
                            onclick="toggleConfirmPassword()">
                        <i class="bi bi-eye" id="confirmToggleIcon"></i>
                    </button>
                </div>
                <div id="passwordMatch" style="color: #ef4444; font-size: 12px; margin-top: 4px; display: none;">
                    <i class="bi bi-x-circle"></i> Passwords do not match
                </div>
                <div id="passwordMatchSuccess" style="color: #22c55e; font-size: 12px; margin-top: 4px; display: none;">
                    <i class="bi bi-check-circle"></i> Passwords match
                </div>
            </div>

            <!-- Terms -->
            <div class="terms-check">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="terms" required>
                    <label class="form-check-label" for="terms">
                        I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
                    </label>
                </div>
            </div>

            <button type="submit" class="btn btn-register" id="registerBtn">
                <i class="bi bi-person-plus me-2"></i>Create Account
            </button>
        </form>

        <!-- ====== DIVIDER ====== -->
        <div class="divider">or</div>

        <!-- ====== FOOTER ====== -->
        <div class="footer-text">
            <p class="mb-0">
                Already have an account?
                <a href="/login">Sign In</a>
            </p>
        </div>

    </div>
</div>

<!-- ====== SCRIPTS ====== -->
<script>
// Toggle Password Visibility
function togglePassword() {
    const password = document.getElementById("password");
    const btn = document.getElementById("toggleBtn");
    const icon = btn.querySelector("i");

    if (password.type === "password") {
        password.type = "text";
        icon.className = "bi bi-eye-slash";
    } else {
        password.type = "password";
        icon.className = "bi bi-eye";
    }
}

function toggleConfirmPassword() {
    const confirm = document.getElementById("confirmPassword");
    const icon = document.getElementById("confirmToggleIcon");

    if (confirm.type === "password") {
        confirm.type = "text";
        icon.className = "bi bi-eye-slash";
    } else {
        confirm.type = "password";
        icon.className = "bi bi-eye";
    }
}

// Password Strength Checker
document.getElementById('password').addEventListener('input', function() {
    const password = this.value;
    const bar = document.getElementById('strengthBar');
    
    // Check requirements
    const hasLength = password.length >= 8;
    const hasUpper = /[A-Z]/.test(password);
    const hasLower = /[a-z]/.test(password);
    const hasNumber = /[0-9]/.test(password);
    
    // Update hints
    updateHint('hintLength', hasLength);
    updateHint('hintUpper', hasUpper);
    updateHint('hintLower', hasLower);
    updateHint('hintNumber', hasNumber);
    
    // Calculate strength
    let strength = 0;
    if (hasLength) strength++;
    if (hasUpper) strength++;
    if (hasLower) strength++;
    if (hasNumber) strength++;
    
    // Update bar
    bar.className = 'bar';
    if (password.length === 0) {
        bar.style.width = '0%';
    } else if (strength <= 1) {
        bar.classList.add('weak');
    } else if (strength === 2) {
        bar.classList.add('medium');
    } else if (strength === 3) {
        bar.classList.add('strong');
    } else {
        bar.classList.add('very-strong');
    }
});

function updateHint(id, isValid) {
    const element = document.getElementById(id);
    const icon = element.querySelector('i');
    if (isValid) {
        element.classList.add('valid');
        icon.className = 'bi bi-check-circle-fill';
    } else {
        element.classList.remove('valid');
        icon.className = 'bi bi-circle';
    }
}

// Password Match Checker
document.getElementById('confirmPassword').addEventListener('input', function() {
    const password = document.getElementById('password').value;
    const confirm = this.value;
    const matchDiv = document.getElementById('passwordMatch');
    const successDiv = document.getElementById('passwordMatchSuccess');
    
    if (confirm.length === 0) {
        matchDiv.style.display = 'none';
        successDiv.style.display = 'none';
        this.classList.remove('is-valid', 'is-invalid');
        return;
    }
    
    if (password === confirm) {
        matchDiv.style.display = 'none';
        successDiv.style.display = 'block';
        this.classList.remove('is-invalid');
        this.classList.add('is-valid');
    } else {
        matchDiv.style.display = 'block';
        successDiv.style.display = 'none';
        this.classList.remove('is-valid');
        this.classList.add('is-invalid');
    }
});

// Form Validation
document.getElementById('registerForm').addEventListener('submit', function(e) {
    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirmPassword').value;
    const terms = document.getElementById('terms').checked;
    const username = document.getElementById('username').value;
    const email = document.getElementById('email').value;
    
    let isValid = true;
    
    // Validate username
    if (username.length < 3) {
        document.getElementById('username').classList.add('is-invalid');
        document.querySelector('#username + .invalid-feedback').style.display = 'block';
        isValid = false;
    } else {
        document.getElementById('username').classList.remove('is-invalid');
        document.querySelector('#username + .invalid-feedback').style.display = 'none';
    }
    
    // Validate email
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!emailRegex.test(email)) {
        document.getElementById('email').classList.add('is-invalid');
        document.querySelector('#email + .invalid-feedback').style.display = 'block';
        isValid = false;
    } else {
        document.getElementById('email').classList.remove('is-invalid');
        document.querySelector('#email + .invalid-feedback').style.display = 'none';
    }
    
    // Validate password match
    if (password !== confirm || confirm.length === 0) {
        document.getElementById('confirmPassword').classList.add('is-invalid');
        isValid = false;
    }
    
    // Validate terms
    if (!terms) {
        document.getElementById('terms').classList.add('is-invalid');
        isValid = false;
    } else {
        document.getElementById('terms').classList.remove('is-invalid');
    }
    
    if (!isValid) {
        e.preventDefault();
    }
});

// Real-time username validation
document.getElementById('username').addEventListener('input', function() {
    if (this.value.length >= 3) {
        this.classList.remove('is-invalid');
        this.classList.add('is-valid');
        document.querySelector('#username + .invalid-feedback').style.display = 'none';
    } else if (this.value.length > 0) {
        this.classList.remove('is-valid');
        this.classList.add('is-invalid');
        document.querySelector('#username + .invalid-feedback').style.display = 'block';
    } else {
        this.classList.remove('is-valid', 'is-invalid');
        document.querySelector('#username + .invalid-feedback').style.display = 'none';
    }
});

// Real-time email validation
document.getElementById('email').addEventListener('input', function() {
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (emailRegex.test(this.value)) {
        this.classList.remove('is-invalid');
        this.classList.add('is-valid');
        document.querySelector('#email + .invalid-feedback').style.display = 'none';
    } else if (this.value.length > 0) {
        this.classList.remove('is-valid');
        this.classList.add('is-invalid');
        document.querySelector('#email + .invalid-feedback').style.display = 'block';
    } else {
        this.classList.remove('is-valid', 'is-invalid');
        document.querySelector('#email + .invalid-feedback').style.display = 'none';
    }
});

// Terms checkbox validation
document.getElementById('terms').addEventListener('change', function() {
    if (this.checked) {
        this.classList.remove('is-invalid');
    }
});
</script>
